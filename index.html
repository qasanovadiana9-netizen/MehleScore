<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliScore — Mehle League</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#17202a;--muted:#7b8794;--line:#e8ecf1;--accent:#1769ff;--dark:#101828}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--dark);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:10}
.brand{font-size:24px;font-weight:800}.sub{font-size:13px;color:#aeb8c6;margin-top:3px}
.container{max-width:1000px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#1769ff,#1646b8);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px #1769ff22}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#dce8ff}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 16px #1018280b;margin-bottom:18px;overflow:hidden}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-head h2{font-size:19px;margin:0}.badge{font-size:12px;background:#eef4ff;color:var(--accent);padding:7px 10px;border-radius:999px;font-weight:700}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}
th{font-size:12px;color:var(--muted);text-align:center;padding:12px 10px;background:#fafbfc}
th:nth-child(2),td:nth-child(2){text-align:left}td{padding:13px 10px;border-top:1px solid var(--line);text-align:center;font-size:14px}
.team{font-weight:700;display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:9px;background:#edf2f7;display:grid;place-items:center;font-size:12px;font-weight:800;color:#465466}
.pos{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;background:#f1f3f6;font-size:12px;font-weight:700}
.points{font-weight:800;color:var(--accent)}.leader{background:#f8fbff}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:18px 20px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;color:#273444}
.form{display:none;padding:18px 20px;background:#fafbfc;border-top:1px solid var(--line)}
.form.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr 110px 110px 150px auto;gap:10px;align-items:end}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}select,input{width:100%;padding:11px;border:1px solid #dce2e8;border-radius:10px;background:#fff;font:inherit}
.note{padding:14px 20px;color:var(--muted);font-size:12px}
.match-card{padding:16px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.match-team{font-weight:700}.match-team.away{text-align:right}.score{font-size:20px;font-weight:900;min-width:72px;text-align:center}.match-date{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}.delete-btn{margin-top:8px;background:#fff0f0;color:#c62828;padding:6px 9px;font-size:11px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){.container{padding:12px}.hero{padding:20px}.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}.card-head{padding:15px}.controls{padding:15px}.match-card{grid-template-columns:1fr auto 1fr}}
</style>
</head>
<body>
<header class="header"><div class="brand">AliScore</div><div class="sub">Football • Mehle League</div></header>

<main class="container">
<section class="hero">
<h1>Mehle League</h1>
<p>League table and match results</p>
</section>

<section class="card">
<div class="card-head"><h2>League Table</h2><span class="badge">2026 Season</span></div>
<div class="table-wrap">
<table>
<thead><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<div class="note">P = Played · W = Wins · D = Draws · L = Losses · GF = Goals For · GA = Goals Against · GD = Goal Difference</div>
</section>

<section class="card">
<div class="card-head"><h2>Matches</h2><span class="badge" id="matchCount">0 matches</span></div>

<div class="controls">
<button class="primary" onclick="toggleForm()">+ Add Match</button>
<button class="secondary" onclick="toggleUpcoming()">Upcoming</button>
<button class="secondary" onclick="toggleResults()">Results</button>
<button class="secondary" onclick="resetLeague()">Reset League</button>
</div>

<div class="form" id="matchForm">
<div class="grid">
<div><label>Home team</label><select id="home"></select></div>
<div><label>Away team</label><select id="away"></select></div>
<div><label>Home goals</label><input id="hg" type="number" min="0" value="0"></div>
<div><label>Away goals</label><input id="ag" type="number" min="0" value="0"></div>
<div><label>Date</label><input id="matchDate" type="date"></div>
<div><button class="primary wide" onclick="addMatch()">Save Match</button></div>
</div>
</div>

<div id="matches"></div>
</section></section>
</main>

<script>
const teams=["MSN FK","Xirdalan United","MSN UNITED","Neweli FK","Mehle FC"];
const key="aliscore_mehle_league_v1";
let matches=JSON.parse(localStorage.getItem(key)||"[]");

function stats(){
 const s={}; teams.forEach(t=>s[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
 matches.forEach(m=>{
  let a=s[m.h],b=s[m.a]; a.p++;b.p++;a.gf+=m.hg;a.ga+=m.ag;b.gf+=m.ag;b.ga+=m.hg;
  if(m.hg>m.ag){a.w++;a.pts+=3;b.l++}else if(m.hg<m.ag){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}
 });
 return s;
}
function render(){
 const s=stats();
 const rows=teams.map(t=>({team:t,...s[t],gd:s[t].gf-s[t].ga}))
 .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.team.localeCompare(b.team));
 tableBody.innerHTML=rows.map((r,i)=>`<tr class="${i===0?'leader':''}">
 <td><span class="pos">${i+1}</span></td><td><div class="team"><span class="logo">${r.team.split(' ').map(x=>x[0]).join('').slice(0,3)}</span>${r.team}</div></td>
 <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?'+':''}${r.gd}</td><td class="points">${r.pts}</td></tr>`).join("");
 matchCount.textContent=matches.length+" match"+(matches.length===1?"":"es");
 matchesEl();
}
function matchesEl(){
 const box=document.getElementById("matches");
 if(!matches.length){box.innerHTML='<div class="note">No matches yet. Add the first result above.</div>';return}
 box.innerHTML=matches.slice().reverse().map((m,i)=>`<div style="padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px">
 <span><b>${m.h}</b> — <b>${m.a}</b></span><b>${m.hg} : ${m.ag}</b></div>`).join("");
}
function fillTeams(){
 ["home","away"].forEach(id=>document.getElementById(id).innerHTML=teams.map(t=>`<option>${t}</option>`).join(""));
 document.getElementById("away").selectedIndex=1;
 const d=new Date();
 document.getElementById("matchDate").value=d.toISOString().slice(0,10);
}
function toggleForm(){document.getElementById("matchForm").classList.toggle("show")}
function addMatch(){
 const h=document.getElementById("home").value,a=document.getElementById("away").value;
 const hg=Number(document.getElementById("hg").value),ag=Number(document.getElementById("ag").value);
 const date=document.getElementById("matchDate").value || new Date().toISOString().slice(0,10);
 if(h===a){alert("Choose two different teams.");return}
 if(hg<0||ag<0||!Number.isInteger(hg)||!Number.isInteger(ag)){alert("Enter valid goals.");return}
 matches.push({h,a,hg,ag,date});
 localStorage.setItem(key,JSON.stringify(matches)); render();
 document.getElementById("hg").value=0;document.getElementById("ag").value=0;
}
function deleteMatch(index){
 if(confirm("Delete this match?")){
   matches.splice(index,1);
   localStorage.setItem(key,JSON.stringify(matches));render();
 }
}
function toggleUpcoming(){
 const box=document.getElementById("matches");
 const future=matches.filter(m=>m.hg===null);
 box.innerHTML=future.length?future.map((m,i)=>`<div class="empty">${m.h} vs ${m.a}</div>`).join(""):'<div class="empty">No upcoming matches.</div>';
}
function toggleResults(){matchesEl()}
function matchesEl(){
 const box=document.getElementById("matches");
 if(!matches.length){box.innerHTML='<div class="empty">No matches yet. Add the first result above.</div>';return}
 box.innerHTML=matches.slice().reverse().map((m,reverseIndex)=>{
   const index=matches.length-1-reverseIndex;
   const date=m.date?new Date(m.date+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"Date not set";
   return `<div class="match-card">
     <div class="match-team">${m.h}</div>
     <div><div class="score">${m.hg} : ${m.ag}</div><div class="match-date">${date}</div><div style="text-align:center"><button class="delete-btn" onclick="deleteMatch(${index})">Delete</button></div></div>
     <div class="match-team away">${m.a}</div>
   </div>`;
 }).join("");
}
function resetLeague(){
 if(confirm("Reset all match results?")){matches=[];localStorage.setItem(key,"[]");render()}
}
fillTeams();render();
</script>
</body>
</html>
