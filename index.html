<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>AliScore</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#101828;--muted:#667085;--line:#e6eaf0;
  --dark:#07111f;--dark2:#0d1b2d;--green:#16a765;--green2:#21c779;
  --red:#dc3545;--blue:#2563eb;--yellow:#f59e0b;--shadow:0 4px 18px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.header{position:sticky;top:0;z-index:100;background:var(--dark);color:#fff;padding:14px 16px 12px;box-shadow:0 3px 18px #0003}
.header-row{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:27px;font-weight:900;letter-spacing:-1.2px}
.brand span{color:var(--green2)}
.subtitle{font-size:11px;color:#91a0b4;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;border:0;background:#132238;color:#fff;border-radius:11px;width:42px;height:42px;font-size:19px}
.badge{position:absolute;right:-3px;top:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:20px;background:#ef4444;color:#fff;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid var(--dark)}
.badge.show{display:flex}
.nav{position:sticky;top:72px;z-index:90;background:#fff;border-bottom:1px solid var(--line);overflow:auto}
.nav-inner{max-width:1120px;margin:auto;display:flex;gap:7px;padding:9px 12px}
.nav button{border:0;background:#f0f3f7;color:#475467;border-radius:10px;padding:9px 13px;font-weight:800;white-space:nowrap}
.nav button.active{background:var(--dark);color:#fff}
.container{max-width:1120px;margin:auto;padding:18px 14px 60px}
.page{display:none}
.page.active{display:block}
.hero{background:linear-gradient(135deg,#07111f,#13253d);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 5px;font-size:27px}
.hero p{margin:0;color:#b9c5d5;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 0 12px}
.section-title{font-size:20px;font-weight:900}
.section-sub{font-size:12px;color:var(--muted)}
.btn{border:0;background:var(--dark);color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}
.btn.green{background:var(--green)}
.btn.light{background:#edf1f5;color:#253043}
.btn.red{background:#fee2e2;color:#b42318}
.btn.blue{background:#dbeafe;color:#1d4ed8}
.btn.small{padding:7px 9px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kpi{padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi .n{font-size:27px;font-weight:900}.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.match-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.match-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:12px}
.match-main{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;text-align:center}
.team-cell{font-weight:850}.team-logo{width:48px;height:48px;border-radius:15px;background:#eef2f6;display:grid;place-items:center;margin:0 auto 7px;font-size:25px}
.score{font-size:27px;font-weight:950}.score-dash{color:#98a2b3}
.status{display:inline-flex;padding:4px 8px;border-radius:7px;background:#ecfdf3;color:#087443;font-size:10px;font-weight:900}
.status.upcoming{background:#eff6ff;color:#1d4ed8}
.status.live{background:#fff1f2;color:#be123c}
.table-wrap{overflow:auto;border-radius:14px}
.table{width:100%;border-collapse:collapse;min-width:620px}
.table th,.table td{padding:10px 8px;border-bottom:1px solid #edf0f3;text-align:center;font-size:13px}
.table th{font-size:11px;color:#667085;text-transform:uppercase;background:#fafbfc}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.rank{font-weight:900;width:32px}
.team-name{font-weight:850}
.form{display:flex;justify-content:center;gap:3px}.dot{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:900}.dot.w{background:#dcfce7;color:#15803d}.dot.d{background:#fef3c7;color:#a16207}.dot.l{background:#fee2e2;color:#b91c1c}
.player-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f3}.player-row:last-child{border-bottom:0}
.avatar{width:45px;height:45px;border-radius:50%;background:#e9eef3;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.player-main{flex:1;min-width:0}.player-name{font-weight:850}.player-team{font-size:11px;color:var(--muted);margin-top:2px}
.stat-chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f1f4f7;padding:6px 8px;border-radius:8px;font-size:11px;color:#475467}.chip b{color:#111827}
.team-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);cursor:pointer}
.team-card:hover{transform:translateY(-1px)}
.team-card-head{display:flex;align-items:center;gap:12px}.team-big-logo{width:55px;height:55px;border-radius:16px;background:#edf1f5;display:grid;place-items:center;font-size:29px}
.team-card h3{margin:0;font-size:17px}.team-card p{margin:4px 0 0;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{border:0;background:#e9edf2;color:#475467;border-radius:9px;padding:8px 11px;font-weight:800;white-space:nowrap}.tabs button.active{background:var(--dark);color:#fff}
.search{width:100%;padding:12px 13px;border:1px solid #d9dee7;border-radius:11px;background:#fff;outline:0}.search:focus{border-color:#98a2b3}
.filter-row{display:grid;grid-template-columns:1fr 180px;gap:9px;margin-bottom:13px}
.empty{text-align:center;padding:32px 10px;color:var(--muted)}
.admin-box{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:var(--shadow)}
.admin-title{font-size:16px;font-weight:900;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{margin-bottom:11px}.field label{display:block;font-size:11px;font-weight:850;color:#475467;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d9dee7;border-radius:10px;background:#fff;outline:0}.field textarea{min-height:80px;resize:vertical}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-list{display:flex;flex-direction:column;gap:8px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border:1px solid #edf0f3;padding:10px;border-radius:11px}
.login-state{font-weight:900}.login-state.ok{color:#087443}.login-state.no{color:#b42318}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:500;padding:18px;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}
.modal{width:100%;max-width:680px;background:#fff;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#eef1f5;border-radius:9px;padding:7px 10px}
.notification-panel{position:fixed;right:14px;top:67px;width:min(390px,calc(100vw - 28px));max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #0003;z-index:450;display:none}
.notification-panel.show{display:block}.notification-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.notification-head b{font-size:15px}
.notification-item{padding:12px 14px;border-bottom:1px solid #edf0f3;cursor:pointer}.notification-item.unread{background:#f0fdf4}.notification-item:last-child{border-bottom:0}.notification-title{font-weight:850;font-size:13px}.notification-text{font-size:12px;color:#667085;margin-top:3px}.notification-time{font-size:10px;color:#98a2b3;margin-top:5px}
.toast-wrap{position:fixed;right:14px;top:78px;z-index:1000;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 28px));pointer-events:none}.toast{background:#fff;border-left:4px solid var(--green);border-radius:12px;padding:12px 14px;box-shadow:0 10px 35px #0002;pointer-events:auto}.toast.error{border-left-color:var(--red)}
.detail-hero{background:linear-gradient(135deg,#07111f,#142940);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.detail-hero-row{display:flex;align-items:center;gap:14px}.detail-logo{width:70px;height:70px;border-radius:18px;background:#ffffff18;display:grid;place-items:center;font-size:37px}.detail-hero h1{margin:0;font-size:26px}.detail-hero p{margin:5px 0 0;color:#b9c5d5;font-size:12px}
.back{margin-bottom:10px}
.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:11px 12px;font-size:12px;margin-bottom:12px}
.hidden{display:none!important}
@media(min-width:760px){
 .container{padding:22px 18px 70px}.modal-bg{align-items:center}.modal{border-radius:18px}
}
@media(max-width:650px){
 .grid,.grid3,.form-grid{grid-template-columns:1fr}.filter-row{grid-template-columns:1fr}.match-main{grid-template-columns:1fr 75px 1fr}.container{padding:15px 11px 55px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-row">
    <div>
      <div class="brand">Ali<span>Score</span></div>
      <div class="subtitle">Mehle League • Futbol statistikası</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notificationBtn" title="Bildirişlər">🔔<span class="badge" id="notificationBadge">0</span></button>
    </div>
  </div>
</header>

<div class="nav">
  <div class="nav-inner">
    <button data-page="home" class="active">Ana səhifə</button>
    <button data-page="matches">Matçlar</button>
    <button data-page="league">Cədvəl</button>
    <button data-page="teams">Komandalar</button>
    <button data-page="players">Oyunçular</button>
    <button data-page="admin">Admin</button>
  </div>
</div>

<main class="container">
  <section id="page-home" class="page active"></section>
  <section id="page-matches" class="page"></section>
  <section id="page-league" class="page"></section>
  <section id="page-teams" class="page"></section>
  <section id="page-players" class="page"></section>
  <section id="page-admin" class="page"></section>
  <section id="page-team-detail" class="page"></section>
  <section id="page-player-detail" class="page"></section>
</main>

<div class="notification-panel" id="notificationPanel">
  <div class="notification-head">
    <b>Bildirişlər</b>
    <div class="actions">
      <button class="btn small light" id="markReadBtn">Hamısını oxu</button>
      <button class="btn small red" id="clearNotificationsBtn">Təmizlə</button>
    </div>
  </div>
  <div id="notificationList"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">AliScore</h2>
      <button class="close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   AliScore — rebuilt stable frontend
   - Works with the existing Express API:
     GET /api/data
     GET /api/admin-status
     POST /api/login
     POST /api/logout
     PUT /api/data
     PUT /api/players/:id
     POST /api/matches
     DELETE /api/matches/:id
   - Also keeps a local fallback so the interface never becomes blank.
   ========================================================= */

const STORAGE_KEY = "aliscore_local_data_v3";
const NOTIFICATION_KEY = "aliscore_notifications_v3";

const DEFAULT_DATA = {
  league:{name:"Mehle League"},
  teams:[
    {id:"wolves",name:"Xirdalan Wolves",logo:"🐺",players:[
      {id:"ali",name:"Ali",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"emin",name:"Emin",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"raul",name:"Raul",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"huseyin2",name:"Huseyin (2 blok)",goals:0,assists:0,saves:0,points:0,photo:""}
    ]},
    {id:"msn",name:"MSN FK",logo:"⚽",players:[
      {id:"fuad",name:"Fuad",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"murad",name:"Murad",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"mine",name:"Minə",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"shamkhal",name:"Şamxal",goals:0,assists:0,saves:0,points:0,photo:""}
    ]},
    {id:"xirdalan-united",name:"Xirdalan United",logo:"🟢",players:[
      {id:"amil",name:"Amil",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"elmir",name:"Elmir",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"huseyin",name:"Huseyin",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"isa",name:"İsa",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"umud",name:"Ümüd",goals:0,assists:0,saves:0,points:0,photo:""}
    ]},
    {id:"lotu",name:"Lotu Pişiklər",logo:"🐱",players:[
      {id:"kamran",name:"Kamran",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"ayxan",name:"Ayxan",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"ramil",name:"Ramil",goals:0,assists:0,saves:0,points:0,photo:""}
    ]},
    {id:"neweli",name:"Neweli FK",logo:"🔵",players:[
      {id:"tofik",name:"Tofik",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"arda",name:"Arda",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"emil",name:"Emil",goals:0,assists:0,saves:0,points:0,photo:""},
      {id:"veli",name:"Vəli",goals:0,assists:0,saves:0,points:0,photo:""}
    ]}
  ],
  matches:[
    {id:"m1",home:"msn",away:"xirdalan-united",homeScore:3,awayScore:0,status:"FT",date:"2026-09-01"},
    {id:"m2",home:"lotu",away:"msn",homeScore:4,awayScore:1,status:"FT",date:"2026-09-03"},
    {id:"m3",home:"wolves",away:"lotu",homeScore:5,awayScore:5,status:"FT",date:"2026-09-05"},
    {id:"m4",home:"neweli",away:"msn",homeScore:10,awayScore:8,status:"FT",date:"2026-09-07"},
    {id:"m5",home:"xirdalan-united",away:"wolves",homeScore:3,awayScore:0,status:"FT",date:"2026-09-09"},
    {id:"m6",home:"xirdalan-united",away:"lotu",homeScore:1,awayScore:0,status:"FT",date:"2026-09-11"},
    {id:"m7",home:"msn",away:"wolves",homeScore:9,awayScore:9,status:"FT",date:"2026-09-13"},
    {id:"m8",home:"neweli",away:"xirdalan-united",homeScore:3,awayScore:5,status:"FT",date:"2026-09-15"}
  ]
};

let data = deepClone(DEFAULT_DATA);
let currentPage = "home";
let currentTeamId = null;
let currentPlayerId = null;
let adminLoggedIn = false;
let notifications = [];
let selectedPlayerForEdit = null;

function deepClone(x){return JSON.parse(JSON.stringify(x));}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function idSafe(v){return String(v??"").trim().toLowerCase().replace(/[^a-z0-9əğıöşüç_-]+/gi,"-");}
function uid(prefix="id"){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);}
function teamById(id){return data.teams.find(t=>String(t.id)===String(id));}
function playerById(id){
  for(const t of data.teams){const p=(t.players||[]).find(x=>String(x.id)===String(id));if(p)return {player:p,team:t};}
  return null;
}
function teamName(id){return teamById(id)?.name || id || "—";}
function teamLogo(id){return teamById(id)?.logo || "⚽";}
function fmtDate(v){
  if(!v)return "Tarix yoxdur";
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return esc(v);
  return d.toLocaleDateString("az-AZ",{day:"2-digit",month:"short",year:"numeric"});
}
function initials(name){
  const parts=String(name||"?").trim().split(/\s+/);
  return (parts[0]?.[0]||"?")+(parts[1]?.[0]||"");
}

/* ---------- Notifications ---------- */
function loadNotifications(){
  try{
    const x=JSON.parse(localStorage.getItem(NOTIFICATION_KEY)||"[]");
    notifications=Array.isArray(x)?x:[];
  }catch(_){notifications=[];}
  renderNotifications();
}
function saveNotifications(){localStorage.setItem(NOTIFICATION_KEY,JSON.stringify(notifications.slice(0,100)));renderNotifications();}
function addNotification(title,text,kind="info"){
  notifications.unshift({id:uid("n"),title,text,kind,read:false,time:new Date().toISOString()});
  saveNotifications();
}
function toast(message,error=false){
  const wrap=document.getElementById("toastWrap");
  const el=document.createElement("div");
  el.className="toast"+(error?" error":"");
  el.textContent=message;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function renderNotifications(){
  const unread=notifications.filter(n=>!n.read).length;
  const badge=document.getElementById("notificationBadge");
  if(badge){badge.textContent=unread>99?"99+":String(unread);badge.classList.toggle("show",unread>0);}
  const list=document.getElementById("notificationList");
  if(!list)return;
  if(!notifications.length){list.innerHTML='<div class="empty">Bildiriş yoxdur</div>';return;}
  list.innerHTML=notifications.map(n=>`
    <div class="notification-item ${n.read?"":"unread"}" data-notification="${esc(n.id)}">
      <div class="notification-title">${esc(n.title)}</div>
      <div class="notification-text">${esc(n.text)}</div>
      <div class="notification-time">${new Date(n.time).toLocaleString("az-AZ")}</div>
    </div>`).join("");
}
function toggleNotifications(){
  document.getElementById("notificationPanel").classList.toggle("show");
}
function markAllRead(){notifications.forEach(n=>n.read=true);saveNotifications();toast("Bütün bildirişlər oxundu");}
function clearNotifications(){notifications=[];saveNotifications();toast("Bildirişlər təmizləndi");}

/* ---------- Local persistence ---------- */
function loadLocal(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(x&&Array.isArray(x.teams)&&Array.isArray(x.matches))data=normalizeData(x);
  }catch(_){}
}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
function normalizeData(raw){
  const x=raw||{};
  const teams=Array.isArray(x.teams)?x.teams:[];
  return {
    league:x.league||{name:"Mehle League"},
    teams:teams.map((t,i)=>({
      id:t.id??idSafe(t.name||("team-"+i)),
      name:t.name||("Team "+(i+1)),
      logo:t.logo||"⚽",
      players:Array.isArray(t.players)?t.players.map((p,j)=>({
        id:p.id??idSafe(p.name||("player-"+j)),
        name:p.name||("Player "+(j+1)),
        goals:num(p.goals),assists:num(p.assists),saves:num(p.saves),points:num(p.points),photo:p.photo||""
      })):[]
    })),
    matches:Array.isArray(x.matches)?x.matches.map((m,i)=>({
      id:m.id??uid("m"),
      home:m.home??m.homeTeam??m.homeTeamId,
      away:m.away??m.awayTeam??m.awayTeamId,
      homeScore:m.homeScore===""?null:num(m.homeScore),
      awayScore:m.awayScore===""?null:num(m.awayScore),
      status:m.status||"FT",
      date:m.date||m.datetime||""
    })):[]
  };
}

/* ---------- API ---------- */
async function api(path,options={}){
  const res=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});
  let body=null;try{body=await res.json();}catch(_){}
  if(!res.ok)throw new Error(body?.error||"Server xətası");
  return body;
}
async function syncFromServer(){
  try{
    const serverData=await api("/api/data");
    if(serverData && Array.isArray(serverData.teams)){
      data=normalizeData(serverData);saveLocal();
      return true;
    }
  }catch(_){}
  return false;
}
async function checkAdmin(){
  try{
    const r=await api("/api/admin-status");
    adminLoggedIn=!!(r?.loggedIn??r?.admin??r?.authenticated);

/* ---------- League calculations ---------- */
function standings(){
  const map={};
  data.teams.forEach(t=>map[t.id]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
  for(const m of data.matches){
    if(m.home==null||m.away==null)continue;
    const h=map[m.home],a=map[m.away];
    if(!h||!a)continue;
    const hs=num(m.homeScore),as=num(m.awayScore);
    if(m.status==="UPCOMING"||m.status==="NS"||m.status==="TBD")continue;
    if(m.homeScore==null||m.awayScore==null)continue;
    h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
    if(hs>as){h.w++;h.pts+=3;a.l++;}
    else if(hs<as){a.w++;a.pts+=3;h.l++;}
    else{h.d++;a.d++;h.pts++;a.pts++;}
  }
  Object.values(map).forEach(x=>x.gd=x.gf-x.ga);
  return Object.values(map).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.team.name.localeCompare(b.team.name));
}
function recentResults(teamId){
  return data.matches.filter(m=>m.home===teamId||m.away===teamId).filter(m=>m.homeScore!=null&&m.awayScore!=null&&m.status!=="UPCOMING").slice(-5);
}
function resultFor(m,teamId){
  const hs=num(m.homeScore),as=num(m.awayScore);
  const own=m.home===teamId?hs:as,opp=m.home===teamId?as:hs;
  return own>opp?"W":own<opp?"L":"D";
}

async function logoutAdmin(){
  try{await api("/api/logout",{method:"POST"});}catch(_){}
  adminLoggedIn=false;addNotification("Admin çıxışı","Admin sessiyası bağlandı.");toast("Çıxış edildi");renderAdmin();
}

/* ---------- Dynamic event delegation ---------- */
function bindDynamic(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    if(el.dataset.bound==="1")return;el.dataset.bound="1";
    el.addEventListener("click",e=>{
      e.stopPropagation();
      const a=el.dataset.action,id=el.dataset.id;
      if(a==="team")renderTeamDetail(id);
      if(a==="player")renderPlayerDetail(id);
      if(a==="edit-player")openPlayerEdit(id);
      if(a==="add-match")openMatchEdit();
      if(a==="edit-match")openMatchEdit(id);
      if(a==="delete-match")deleteMatch(id);
      if(a==="login")loginAdmin();
      if(a==="logout")logoutAdmin();
    });
  });
  document.querySelectorAll("[data-page-link]").forEach(el=>{
    if(el.dataset.bound2==="1")return;el.dataset.bound2="1";
    el.addEventListener("click",()=>showPage(el.dataset.pageLink));
  });
}
function refreshCurrent(){
  if(currentPage==="home")renderHome();
  else if(currentPage==="matches")renderMatches();
  else if(currentPage==="league")renderLeague();
  else if(currentPage==="teams")renderTeams();
  else if(currentPage==="players")renderPlayers();
  else if(currentPage==="admin")renderAdmin();
  else if(currentPage==="team-detail")renderTeamDetail(currentTeamId);
  else if(currentPage==="player-detail")renderPlayerDetail(currentPlayerId);
}

/* ---------- Global events ---------- */
document.getElementById("notificationBtn").addEventListener("click",e=>{e.stopPropagation();toggleNotifications();});
document.getElementById("markReadBtn").addEventListener("click",markAllRead);
document.getElementById("clearNotificationsBtn").addEventListener("click",clearNotifications);
document.getElementById("modalClose").addEventListener("click",closeModal);
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
document.addEventListener("click",e=>{
  const p=document.getElementById("notificationPanel");
  if(!p.contains(e.target)&&!document.getElementById("notificationBtn").contains(e.target))p.classList.remove("show");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();document.getElementById("notificationPanel").classList.remove("show");}});

async function init(){
  loadLocal();
  loadNotifications();
  bindNav();
  renderHome();
  await syncFromServer();
  await checkAdmin();
  if(currentPage==="home")renderHome();
}
init();
</script>
